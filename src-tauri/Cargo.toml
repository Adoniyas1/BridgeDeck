[package]
name = "bridgedeck"
version = "0.9.1"
description = "Cross-platform Mac and Windows control dashboard"
authors = ["BridgeDeck contributors"]
edition = "2021"

[lib]
name = "bridgedeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
# BridgeDeck v0.7 uses the pinned LocalSend core directly for native send/receive.
# vendor/localsend is populated by vendor:fetch or upgrade-from-previous.sh before native builds.
localsend = { path = "../vendor/localsend/packages/core", features = ["full"] }
bytes = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
mime_guess = "2"
anyhow = "1"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
ruzstd = "0.9.1"
jpeg-encoder = "0.7"
sha2 = "0.10"
# BridgeLink v2: QUIC between paired devices with pinned self-signed certificates.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
rand = "0.8"
# Syncthing conflict copies that aren't kept go to the Trash / Recycle Bin.
trash = "5"
url = "2"
sysinfo = { version = ">=0.30, <1", default-features = false, features = ["system"] }
# Clipboard sync between paired devices.
arboard = "3"
png = "0.17"
# Wake-on-LAN: paired computers report their hardware addresses.
mac_address = "1"
tar = { version = "0.4", default-features = false }
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
fsrs = "6.6.2"
lzma-rs = "0.3"

# Settings secrets (API keys, passwords, tokens) live in the OS credential store, not the settings file.
# Remote control host: screen capture and input (macOS and Windows only).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
xcap = "0.9"
enigo = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSObject", "NSString"] }
# Remote control's sound (ScreenCaptureKit, macOS 13+); its video encoder uses VideoToolbox's C API.
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-media", "SCShareableContent", "SCStream"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMSampleBuffer", "CMTime"] }
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
objc2 = "0.6"
block2 = "0.6"
# Reading handwriting with Apple's Vision (handwriting_mac.rs).
objc2-vision = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "VNDetectDocumentSegmentationRequest", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNObservation", "VNTypes"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKContentRuleList", "WKContentRuleListStore", "WKPreferences", "WKUserContentController", "WKWebView", "WKWebViewConfiguration"] }
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_Graphics_Imaging", "Win32_System_Ole", "Win32_System_Variant", "Win32_Media_MediaFoundation", "Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Foundation", "Media_Control", "Storage_Streams"] }
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

# `npm run tauri dev` builds in the dev profile. Screen capture, change detection and JPEG encoding
# are far too slow unoptimized (remote control ran at 1-2 fps), so optimize the app and its crates.
[profile.release]
# Rebuilds after a small change reuse the unchanged parts of BridgeDeck's own code (minutes → about
# a minute); the app runs about the same.
incremental = true

[profile.dev]
opt-level = 2
# Line numbers only (enough for panics and backtraces): full debug info made the build folder
# many gigabytes larger.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
