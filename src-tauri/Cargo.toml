[package]
name = "bridgedeck"
version = "0.8.1"
description = "Cross-platform Mac and Windows control dashboard"
authors = ["BridgeDeck contributors"]
edition = "2021"

[lib]
name = "bridgedeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# BridgeDeck v0.7 uses the pinned LocalSend core directly for native send/receive.
# vendor/localsend is populated by vendor:fetch or upgrade-from-previous.sh before native builds.
localsend = { path = "../vendor/localsend/packages/core", features = ["full"] }
bytes = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
mime_guess = "2"
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
sysinfo = { version = ">=0.30, <1", default-features = false, features = ["system"] }

# Settings secrets (API keys, passwords, tokens) live in the OS credential store, not the settings file.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }
