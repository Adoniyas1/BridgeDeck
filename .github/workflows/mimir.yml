# Mimir (mimir/) is its own Node project: its checks run when it changes.
name: Mimir

on:
  pull_request:
    paths: ['mimir/**', '.github/workflows/mimir.yml']

concurrency:
  group: mimir-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mimir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mimir
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mimir/package-lock.json
      # No native add-ons are needed for the checks (keytar falls back to memory; wake word is optional).
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
