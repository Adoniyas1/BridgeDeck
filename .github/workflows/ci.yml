# The web app's checks for pull requests that change it (roadmap D13). The Rust side is checked by
# rust.yml (and macOS by mac-check.yml), Mimir by mimir.yml: each runs only when its own files change,
# since this is a private repository and Actions minutes are limited.
name: CI

on:
  pull_request:
    paths-ignore: ['src-tauri/**', 'mimir/**', '**/*.md', '.github/workflows/rust.yml', '.github/workflows/mimir.yml', '.github/workflows/mac-check.yml', '.github/workflows/release.yml']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run verify:project
