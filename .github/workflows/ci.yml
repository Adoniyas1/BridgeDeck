# Cheap checks for every pull request and push to main (roadmap D13). Everything runs on Linux;
# the Windows build is compile-checked by cross-compiling. macOS code is checked by mac-check.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run verify:project

  # Mimir (mimir/) is its own Node project: its typecheck, tests and lint.
  mimir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mimir
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mimir/package-lock.json
      # No native add-ons are needed for the checks (keytar falls back to memory; wake word is optional).
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  rust:
    runs-on: ubuntu-latest
    env:
      # Linux, Windows and test builds of the whole crate don't fit the runner's disk with debug info.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Free disk space (preinstalled SDKs the build doesn't use)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h /
      - uses: actions/checkout@v4
      - name: Install Tauri system libraries and the MinGW cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the pinned LocalSend core (the only vendored crate the build needs)
        run: node scripts/vendor.mjs fetch --only localsend
      - name: Check (Linux)
        working-directory: src-tauri
        run: cargo check --locked
      - name: Check (Windows, cross-compiled)
        working-directory: src-tauri
        run: cargo check --locked --target x86_64-pc-windows-gnu
      - name: Test
        working-directory: src-tauri
        run: cargo test --locked
