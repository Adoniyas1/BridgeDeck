# The Rust side (src-tauri/) on Linux, cross-compiled for Windows, and its tests, when it changes.
# It also runs after a merge to main so pull requests start from a warm build cache.
name: Rust

on:
  pull_request:
    paths: ['src-tauri/**', 'scripts/vendor.mjs', '.github/workflows/rust.yml']
  push:
    branches: [main]
    paths: ['src-tauri/**']

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    # A stuck step (a package mirror that never answers) mustn't run for hours.
    timeout-minutes: 30
    env:
      # Linux, Windows and test builds of the whole crate don't fit the runner's disk with debug info.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Free disk space (preinstalled SDKs the build doesn't use)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h /
      - uses: actions/checkout@v4
      - name: Install Tauri system libraries and the MinGW cross compiler
        # 204 MB of packages; the Ubuntu mirror is sometimes slow enough that this takes ~15 minutes.
        timeout-minutes: 30
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120 install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the pinned LocalSend core (the only vendored crate the build needs)
        run: node scripts/vendor.mjs fetch --only localsend
      - name: Check (Linux)
        working-directory: src-tauri
        run: cargo check --locked
      - name: Check (Windows, cross-compiled)
        working-directory: src-tauri
        run: cargo check --locked --target x86_64-pc-windows-gnu
      - name: Test
        working-directory: src-tauri
        run: cargo test --locked
